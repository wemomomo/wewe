
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Niveous">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<meta http-equiv="Content-Security-Policy" content="frame-src 'none';">

<!-- 苹果 iOS PWA 桌面原生高清图标 -->
<link rel="apple-touch-icon" href="https://niveousmoon.top/images/img_1788303212186_2hm3q.jpg">
<link rel="apple-touch-icon" sizes="152x152" href="https://niveousmoon.top/images/img_1788303212186_2hm3q.jpg">
<link rel="apple-touch-icon" sizes="180x180" href="https://niveousmoon.top/images/img_1788303212186_2hm3q.jpg">
<link rel="apple-touch-icon" sizes="167x167" href="https://niveousmoon.top/images/img_1788303212186_2hm3q.jpg">
<link rel="icon" type="image/jpeg" href="https://niveousmoon.top/images/img_1788303212186_2hm3q.jpg">

<link rel="manifest" href="manifest.json">
<title>Niveous</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="apps.css">
<link rel="stylesheet" href="tabbar.css">
<link rel="stylesheet" href="edit-drag.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="wechat.css">
<link rel="stylesheet" href="imgbed.css">
<link rel="stylesheet" href="beautify.css">
<link rel="stylesheet" href="worldbook.css">
<link rel="stylesheet" href="forum.css">
<link rel="stylesheet" href="archive.css">
<link rel="stylesheet" href="character.css">
<link rel="stylesheet" href="ai-image.css">
</head>
<body>

<!-- 全局全屏壁纸层 -->
<div class="home-bg-layer" id="homeBgLayer"></div>

<div class="app-shell">
  <div class="page-container" id="pageContainer">

    <!-- 编辑模式工具按钮组（左上角） -->
    <div class="edit-toolbar-group">
      <button class="reset-layout-btn" id="resetLayoutBtn" type="button">
        <svg viewBox="0 0 24 24">
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
        <span>恢复初始</span>
      </button>

      <button class="edit-tool-btn" id="addHomeBgBtn" type="button">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span>添加背景</span>
      </button>
    </div>

    <!-- ========================================== -->
    <!-- 桌面 (Home) - 双屏滑动容器 -->
    <!-- ========================================== -->
    <div class="page active" data-page="home">

      <div class="desktop-slider-wrapper">
        <div class="desktop-slider" id="desktopSlider">
          
          <!-- 桌面第 1 屏 (3个大组件卡片) -->
          <div class="desktop-screen" data-screen-idx="0">
            <!-- 1. 个人卡片 -->
            <div class="profile-card draggable" id="profileCard" data-component="card">
              <div class="card-bg" id="cardBg"></div>
              <div class="card-upper" id="cardUpper"></div>
              <div class="card-lower">
                <div class="lower-overlay" id="lowerOverlay"></div>
                <div class="avatar-wrapper" id="avatarBtn">
                  <img id="avatarImg" alt="头像">
                  <svg class="avatar-placeholder" viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                </div>
                <div class="info-area">
                  <div class="info-text line-1" contenteditable="true" data-key="line1" data-placeholder="点击头像上方加载卡片背景"></div>
                  <div class="info-text line-2" contenteditable="true" data-key="line2" data-placeholder="长按空白处进入美化编辑"></div>
                  <div class="info-text line-3" contenteditable="true" data-key="line3" data-placeholder="组件可进行上下拖拽"></div>
                  <div class="info-text line-4">
                    <svg class="location-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                    <span class="location-text" contenteditable="true"></span>
                  </div>
                </div>
              </div>
              <button class="edit-btn" data-edit-target="card">编辑</button>
            </div>

            <!-- 2. 消息卡片 -->
            <div class="message-card draggable" id="messageCard" data-component="message">
              <div class="message-avatar" id="messageAvatar">
                <img id="messageAvatarImg" alt="角色头像">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
              </div>
              <div class="message-content">
                <div class="message-preview" id="messagePreview" contenteditable="true">暂未联通角色...</div>
              </div>
              <div class="message-badge" id="messageBadge">
                <svg class="badge-icon" id="messageBadgeIcon" viewBox="0 0 20 22">
                  <path d="M4 2 L16 2 Q18 2 18 4 L18 12 Q18 14 16 14 L11 14 L10 17 L9 14 L4 14 Q2 14 2 12 L2 4 Q2 2 4 2 Z" 
                        stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                  <circle cx="6" cy="8" r="1" fill="currentColor"/>
                  <circle cx="10" cy="8" r="1" fill="currentColor"/>
                  <circle cx="14" cy="8" r="1" fill="currentColor"/>
                </svg>
                <span id="messageBadgeText">最新讯息</span>
              </div>
              <button class="edit-btn" data-edit-target="message">编辑</button>
            </div>

            <!-- 3. 头像展示区 -->
            <div class="couple-section draggable" id="coupleSection" data-component="couple">
              <div class="couple-left">
                <div class="couple-icons">
                  <div class="couple-icon-item" data-action="beautify">
                    <div class="couple-icon-circle">
                      <svg viewBox="0 0 24 24">
                        <polygon class="star-fill" points="12,2 14.5,9 22,9.5 16.5,14 18,21.5 12,17.5 6,21.5 7.5,14 2,9.5 9.5,9"/>
                        <circle cx="19" cy="4" r="1.5" stroke-width="1.2"/>
                        <circle cx="20" cy="8" r="1" stroke-width="1"/>
                      </svg>
                    </div>
                    <span>美化</span>
                  </div>
                  <div class="couple-icon-item" data-action="worldbook">
                    <div class="couple-icon-circle">
                      <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M3.6 9h16.8"/>
                        <path d="M3.6 15h16.8"/>
                        <ellipse cx="12" cy="12" rx="4.5" ry="9"/>
                      </svg>
                    </div>
                    <span>世界书</span>
                  </div>
                  <div class="couple-icon-item" data-action="forum">
                    <div class="couple-icon-circle">
                      <svg viewBox="0 0 24 24">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        <path d="M8 9h8"/>
                        <path d="M8 13h5"/>
                      </svg>
                    </div>
                    <span>论坛</span>
                  </div>
                  <div class="couple-icon-item" data-action="archive" data-open-app="archive">
                    <div class="couple-icon-circle">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <circle cx="12" cy="13" r="2"/>
                        <path d="M8.5 18a3.5 3.5 0 0 1 7 0"/>
                      </svg>
                    </div>
                    <span>档案</span>
                  </div>
                </div>
              </div>
              <div class="couple-right">
                <div class="couple-avatars">
                  <div class="couple-avatar-item">
                    <div class="couple-speech" contenteditable="true" id="coupleSpeech1">对话1</div>
                    <div class="couple-avatar-circle" id="coupleAvatar1">
                      <img id="coupleAvatarImg1" alt="">
                      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    </div>
                    <div class="couple-name" contenteditable="true" id="coupleName1">TA</div>
                  </div>
                  <div class="couple-avatar-item">
                    <div class="couple-speech" contenteditable="true" id="coupleSpeech2">对话2</div>
                    <div class="couple-avatar-circle" id="coupleAvatar2">
                      <img id="coupleAvatarImg2" alt="">
                      <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
                    </div>
                    <div class="couple-name" contenteditable="true" id="coupleName2">你</div>
                  </div>
                </div>
                <div class="couple-date-card" id="coupleDateCard">
                  <div class="date-card-header">
                    <span class="date-card-text">和<span class="date-card-name" id="datePartnerName">TA</span>在一起 已经</span>
                    <span class="date-card-days" id="dateDaysCount">0</span>
                    <span class="date-card-unit">天</span>
                    <input type="date" id="dateStartInput" class="date-hidden-input">
                  </div>
                  <div class="date-card-calendar">
                    <div class="date-card-labels">
                      <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
                    </div>
                    <div class="date-card-dates" id="dateWeekDates"></div>
                  </div>
                </div>
              </div>
              <button class="edit-btn" data-edit-target="couple">编辑</button>
            </div>
          </div>

          <!-- 桌面第 2 屏 (图床、AI生图等应用专属屏幕) -->
          <div class="desktop-screen" data-screen-idx="1">
            <div class="desktop-apps-container">
              
              <!-- 图标 1：图床 -->
              <div class="couple-icon-item" data-goto="imgbed" data-open-app="imgbed">
                <div class="couple-icon-circle">
                  <svg viewBox="0 0 24 24">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                </div>
                <span>图床</span>
              </div>

              <!-- 图标 2：AI 生图工坊 (点击秒开) -->
              <div class="couple-icon-item" id="desktopAiImageBtn" data-action="ai-image">
                <div class="couple-icon-circle">
                  <!-- 星芒画笔微光图标 -->
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/>
                    <circle cx="19" cy="5" r="1.5" fill="currentColor"/>
                    <circle cx="5" cy="19" r="1.5" fill="currentColor"/>
                  </svg>
                </div>
                <span>生图</span>
              </div>

            </div>
          </div>

        </div>
      </div>

      <!-- 桌面指示小圆点 -->
      <div class="desktop-pagination" id="desktopPagination">
        <span class="desktop-dot active" data-screen="0"></span>
        <span class="desktop-dot" data-screen="1"></span>
      </div>

    </div>

    <!-- App 空壳页面挂载点 -->
    <div class="page app-page" data-page="archive"></div>
    <div class="page app-page" data-page="character"></div>
    <div class="page app-page" data-page="imgbed"></div>
    <div class="page app-page" data-page="wechat"></div>
    <div class="page app-page" data-page="offline"></div>
    <div class="page app-page" data-page="settings"></div>
    <div class="page app-page" data-page="check"></div>

  </div>

  <!-- 底部栏编辑按钮 -->
  <button class="edit-btn tabbar-edit-btn" data-edit-target="tabbar">编辑</button>

  <!-- 桌面 Dock 栏 -->
  <div class="tab-bar">
    <div class="tab-bar-capsule">
      <div class="tab-item" data-tab="wechat">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 11c2.8 0 5 1.7 5 3.8 0 1.4-1 2.6-2.5 3.3l.3 2-1.8-1.1c-.5.1-1.1.2-1.7.2-2.8 0-5-1.7-5-3.8 0-.2 0-.5.1-.7"/>
            <path d="M9 3.5C5 3.5 2 6 2 9c0 1.7 1 3.2 2.7 4.3L4 16l2.8-1.4c.7.2 1.5.3 2.2.3 4 0 7-2.5 7-5.5S13 3.5 9 3.5z"/>
          </svg>
        </div>
        <div class="tab-label">微信</div>
      </div>
      <div class="tab-item" data-tab="offline">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            <path d="M12 7l1.2 2.5 2.8.4-2 2 .5 2.8-2.5-1.3-2.5 1.3.5-2.8-2-2 2.8-.4z" stroke-width="1.2"/>
          </svg>
        </div>
        <div class="tab-label">线下</div>
      </div>
      <div class="tab-item" data-tab="settings">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1.08 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </div>
        <div class="tab-label">设置</div>
      </div>
      <div class="tab-item" data-tab="check">
        <div class="tab-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
            <path d="M12 18h.01"/>
            <path d="M9 6h6"/>
          </svg>
        </div>
        <div class="tab-label">查岗</div>
      </div>
    </div>
  </div>
</div>

<!-- 裁剪器 -->
<div class="crop-overlay" id="cropOverlay">
  <div class="crop-container">
    <div class="crop-header">
      <button class="crop-cancel" id="cropCancelBtn" type="button">取消</button>
      <span>裁剪图片</span>
      <button class="crop-confirm" id="cropConfirmBtn" type="button">确定</button>
    </div>
    <div class="crop-toolbar">
      <button class="crop-ratio-btn active" data-ratio="free" type="button">自由</button>
      <button class="crop-ratio-btn" data-ratio="1" type="button">1:1</button>
      <button class="crop-ratio-btn" data-ratio="4:3" type="button">4:3</button>
      <button class="crop-ratio-btn" data-ratio="16:9" type="button">16:9</button>
    </div>
    <div class="crop-workspace" id="cropWorkspace">
      <canvas id="cropCanvas"></canvas>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="components.js"></script>
<script src="edit-drag.js"></script>
<script src="tabbar.js"></script>
<script src="settings.js"></script>
<script src="wechat.js"></script>
<script src="imgbed.js"></script>
<script src="beautify.js"></script>
<script src="worldbook.js"></script>
<script src="forum.js"></script>
<script src="archive.js"></script>
<script src="ai-image.js"></script>
</body>
</html>
